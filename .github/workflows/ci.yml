name: Auth service checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Go and PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: auth_ci
          POSTGRES_PASSWORD: auth-ci-fixture
          POSTGRES_DB: auth_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auth_ci -d auth_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MINECRAFT_AUTH_TEST_DATABASE: postgres://auth_ci:auth-ci-fixture@127.0.0.1:5432/auth_ci?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - name: Fresh install, archive upgrade and auth integration
        run: go test -race -count=1 -v ./...
