services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: alpha_auth
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:${APP_PORT:-3000}'
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      AUTH_SIGNING_KEY_FILE: /run/auth/yggdrasil.pem
    volumes:
      - ${AUTH_SIGNING_KEY_HOST_FILE:-./secrets/yggdrasil.pem}:/run/auth/yggdrasil.pem:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_network

  db:
    image: postgres:15-alpine
    container_name: alpha_auth_db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
